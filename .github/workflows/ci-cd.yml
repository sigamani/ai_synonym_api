## File: .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.11'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint black

    # Step 4: Set OpenAI API Key
    - name: Set OpenAI API Key
      uses: actions/github-script@v6
      with:
        script: |
           core.exportVariable('OPENAI_API_KEY', '${{ secrets.OPENAI_API_KEY }}')

      # Step 5: Run pylint for static analysis check (fails under 9/10)
    - name: Run pylint
      run: |
        pylint --fail-under=9.0 app/ services/

      # Step 6: Run black for code formatting check
    - name: Run black (check mode)
      run: |
        black --check app/ services/

      # Step 7: Run pytest to test the application
    - name: Run tests with pytest
      run: |
        pytest app/tests/

      # Step 8: Start the application
    - name: Start application
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Step 9: Wait for the server
    - name: Wait for application to start
      run: |
        sleep 5
        curl --fail http://0.0.0.0:8000/docs

      # Step 10: Run a curl test
    - name: Test /synonyms endpoint
      run: |
        RESPONSE=$(curl -X 'POST' \
          'http://0.0.0.0:8000/synonyms' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{"word": "happy"}')
        echo "$RESPONSE"
        if ! echo "$RESPONSE" | grep -q 'synonyms'; then
          echo "Test failed: Synonyms not found in response"
          exit 1
        fi