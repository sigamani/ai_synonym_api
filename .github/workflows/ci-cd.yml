## File: .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint black

    - name: Set OpenAI API Key
      uses: actions/github-script@v6
      with:
        script: |
           core.exportVariable('OPENAI_API_KEY', '${{ secrets.OPENAI_API_KEY }}')

      # Step 4: Run pylint for static analysis
    - name: Run pylint
      run: |
        pylint --fail-under=8.0 app/ services/

      # Step 5: Run black for code formatting check
    - name: Run black (check mode)
      run: |
        black --check app/ services/

      # Step 4: Run pytest to test the application
    - name: Run tests with pytest
      run: |
        pytest app/tests/
